[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indonesia-wildfire-analysis"
version = "0.2.0"
description = "Reproducible matched satellite-observation research for Kalimantan fire and land-cover change"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Indonesia Wildfire Analysis contributors" }]
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "statsmodels==0.14.4",
  "matplotlib==3.9.2",
  "pyarrow==24.0.0",
  "rasterio==1.5.0",
  "pyproj==3.7.1",
  "geopandas==1.0.1",
  "earthengine-api==1.7.41",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]
acquisition = [
  "requests==2.32.3",
  "psutil==6.1.0",
  "netCDF4==1.7.4",
  "pyhdf==0.11.7",
  "earthaccess>=0.12,<1",
  "cdsapi>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
